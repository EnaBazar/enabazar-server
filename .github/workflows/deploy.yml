name: Inabazar Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: inabazar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Run deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/enabazar-server
            bash deploy.sh
